server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name chatplan.duckdns.org;

    root /var/www/chat2-web;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8092/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8092/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8092/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }

    ssl_certificate /etc/letsencrypt/live/chatplan.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatplan.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name chatplan.duckdns.org;

    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl ipv6only=on;
    server_name chatplan.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/chatplan.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatplan.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://$host$request_uri;
}
